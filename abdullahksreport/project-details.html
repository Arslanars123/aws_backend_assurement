<!-- Project Details Page -->
<div class="project-details-container">
    <div class="project-details-page">
        <!-- Header -->
        <div class="project-details-header">
            <div class="project-details-header-title">01. PROJECT DETAILS</div>
        </div>

        <!-- Main Content -->
        <div class="project-details-content">
            <!-- Top Row - Two Columns -->
            <div class="project-details-top-row">
                <!-- Left Column - Construction Case -->
                <div class="project-details-section">
                    <div class="project-details-section-header">
                        <span>CONSTRUCTION CASE</span>
                    </div>
                    <div class="project-details-fields">
                        <div class="project-details-field">
                            <label>Date</label>
                            <div class="project-details-value" id="constructionCaseDate"></div>
                        </div>
                        <div class="project-details-field">
                            <label>CASE ID:</label>
                            <div class="project-details-value" id="constructionCaseId"></div>
                        </div>
                        <div class="project-details-field">
                            <label>NAME:</label>
                            <div class="project-details-value" id="constructionCaseName"></div>
                        </div>
                        <div class="project-details-field">
                            <label>ADDRESS:</label>
                            <div class="project-details-value" id="constructionCaseAddress"></div>
                        </div>
                        <div class="project-details-field">
                            <label>POSTCODE:</label>
                            <div class="project-details-value" id="constructionCasePostcode"></div>
                        </div>
                        <div class="project-details-field">
                            <label>STARTING DATE</label>
                            <div class="project-details-value" id="constructionCaseStartingDate"></div>
                        </div>
                        <div class="project-details-field">
                            <label>DEADLINE</label>
                            <div class="project-details-value" id="constructionCaseDeadline"></div>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Main Contractors -->
                <div class="project-details-section">
                    <div class="project-details-section-header">
                        <span>Main and main contractor/BH</span>
                    </div>
                    <div id="mainContractorsContainer">
                        <!-- Will be populated by server -->
                    </div>
                </div>
            </div>

            <!-- Construction Management -->
            <div class="project-details-section">
                <div class="project-details-section-header">
                    <span>CONSTRUCTION MANAGEMENT</span>
                </div>
                <div id="constructionManagersContainer">
                    <!-- Will be populated by server -->
                </div>
            </div>

            <!-- Safety Coordinator -->
            <div class="project-details-section">
                <div class="project-details-section-header">
                    <span>SAFETY COORDINATOR</span>
                </div>
                <div id="safetyManagersContainer">
                    <!-- Will be populated by server -->
                </div>
            </div>

            <!-- Certification Schemes -->
            <div class="project-details-section">
                <div class="project-details-section-header-split">
                    <span>CERTIFICATION SCHEMES</span>
                    <span>LEVEL</span>
                </div>
                <div id="schemesContainer">
                    <!-- Will be populated by server -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="toc-footer">
            <div class="toc-footer-left">Page 2 of 34</div>
            <div class="toc-footer-center">
                <div class="qa-logo-circle">
                    <img id="footerCompanyLogo" src="" alt="Company Logo" class="qa-logo-image" style="display: none;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <!-- <div class="qa-logo-a" id="footerCompanyLogoFallback">A</div> -->
                </div>
                <div class="toc-logo">
                    <!-- <div class="toc-logo-circle">
                        <div class="toc-logo-a" id="footerTocLogo">A</div>
                    </div> -->
                    <span class="toc-logo-text">Assurement</span>
                </div>
            </div>
            <div class="toc-footer-right">Part of</div>
        </div>
    </div>
</div>
