<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS Report - Abdullah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="report-container">
        <!-- ReportPage1 will be loaded here -->
    </div>
    
    <script>
        // Load ReportPage1 content
        fetch('report-page1.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('report-container').innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading report:', error);
                document.getElementById('report-container').innerHTML = '<p>Error loading report. Please check the console.</p>';
            });
    </script>
</body>
</html>
