<!-- Report Page 1 -->
<div class="qa-report-container">
    <div class="qa-report-page">
        <!-- Header Section -->
        <div class="qa-header">
            <div class="qa-header-left">
                <div class="qa-logo">
                    <div class="qa-logo-circle">
                        <img id="companyLogo" src="" alt="Company Logo" class="qa-logo-image" style="display: none;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <!-- <div class="qa-logo-a" id="companyLogoFallback">A</div> -->
                    </div>
                    <div class="qa-logo-text">
                        <div class="qa-logo-title">Assurement Report - system</div>
                        <div class="qa-logo-subtitle">Part of Quality Assurance Denmark</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="qa-content">
            <!-- Left Column with Blue Line -->
            <div class="qa-left-column">
                <div class="qa-blue-line"></div>

                <!-- Performing Company Section -->
                <div class="qa-section">
                    <div class="qa-section-title">Performing company:</div>
                    <div class="qa-form-group">
                        <label>Post no. / City:</label>
                        <div class="qa-value" id="postNoCity"></div>
                    </div>
                    <div class="qa-form-group">
                        <label>Address:</label>
                        <div class="qa-value" id="address"></div>
                    </div>
                    <div class="qa-form-group">
                        <label>CVR:</label>
                        <div class="qa-value" id="cvr"></div>
                    </div>
                    <div class="qa-form-group">
                        <label>Telephone:</label>
                        <div class="qa-value" id="telephone"></div>
                    </div>
                    <div class="qa-form-group">
                        <label>Mail:</label>
                        <div class="qa-value" id="mail"></div>
                    </div>
                </div>

                <!-- Main Title -->
                <div class="qa-main-title">QUALITY ASSURANCE REPORT</div>

                <!-- Report Specifics -->
                <div class="qa-section">
                    <div class="qa-form-group">
                        <label>FOR PROFESSIONAL GROUP:</label>
                        <div class="qa-value">Quality Assurance</div>
                    </div>
                    <div class="qa-form-group">
                        <label>FOR CONSTRUCTION TYPE:</label>
                        <div class="qa-value">Construction Project</div>
                    </div>
                </div>
            </div>

            <!-- Project ID Section -->
            <div class="qa-project-id-section">
                <div class="qa-project-id-table">
                    <div class="qa-project-id-cell">
                        <span>Project ID Case no.:</span>
                    </div>
                    <div class="qa-project-id-value-cell">
                        <div class="qa-project-id-value" id="projectId"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="toc-footer">
            <div class="toc-footer-left">Page 0 of 34</div>
            <div class="toc-footer-center">
                <div class="qa-logo-circle">
                    <img id="footerCompanyLogo" src="" alt="Company Logo" class="qa-logo-image" style="display: none;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <!-- <div class="qa-logo-a" id="footerCompanyLogoFallback">A</div> -->
                </div>
                <div class="toc-logo">
                    <!-- <div class="toc-logo-circle">
                        <div class="toc-logo-a" id="footerTocLogo">A</div>
                    </div> -->
                    <span class="toc-logo-text">Assurement</span>
                </div>
            </div>
            <div class="toc-footer-right">Part of</div>
        </div>
    </div>
</div>
